version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data
      - ./proxies:/app/proxies
    env_file:
      - ./.env

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/src:/app/src
    env_file:
      - ./.env

volumes:
  backend_data:
